<style>
    .message-container {
        position: absolute;
        z-index: 300;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.5rem 1.3rem;
        animation-name: drop_message;
        animation-duration: 800ms;
        animation-direction: normal;
        animation-fill-mode: forwards;
        border-radius: 20px;
        width: 90%;
        max-width: 700px;

        display: flex;
        align-items: center;
        gap: 1rem;
        overflow: hidden;
    }

    @keyframes drop_message {
        from {
            top: -100%
        }
        to {
            top: 70px
        }
    }

    .success {
        color: white;
        background: #07b62f;
    }

    .warning {
        color: white;
        background: #d8910e;
    }

    .error {
        color: white;
        background: #e6293f;
    }

    .info {
        color: white;
        background: hsl(0, 0%, 40%);
    }

    .message {
        letter-spacing: 0.05rem;
        font-size: clamp(0.85rem, 1vw + 0.5rem, 1rem);
        font-weight: 500;
        line-height: 1.2;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .close-message-btn {
        margin-left: auto;
        width: 22px;
        aspect-ratio: 1/1;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        font-size: 1.2rem;
        border: none;
        cursor: pointer;
        background: none;
        padding-top: 0.2rem;
    }

</style>

{% if messages %}
    {% for message in messages%}
        {% if message.tags == 'success' %}
            <div class="success message-container">
                <p class="message">{{ message }}</p>
                <button class="close-message-btn">
                    <i class="fas fa-close"></i>
                </button>
            </div>
        {% elif message.tags == 'error' %}
            <div class="error message-container">
                <p class="message">{{ message }}</p>
                <button class="close-message-btn">
                    <i class="fas fa-close"></i>
                </button>
            </div>
        {% elif message.tags == 'warning' %}
            <div class="warning message-container">
                <p class="message">{{ message }} </p>
                <button class="close-message-btn">
                    <i class="fas fa-close"></i>
                </button>
            </div>
        {% elif message.tags == 'info' %}
            <div class="info message-container">
                <p class="message">{{ message }}</p>
                <button class="close-message-btn">
                    <i class="fas fa-close"></i>
                </button>
            </div>
        {% endif %}
    {% endfor %}
{% endif %}

<script>
    const closeMessageBtn = [...document.querySelectorAll('.close-message-btn')]
    const messageContainer = [...document.querySelectorAll('.message-container')]

    closeMessageBtn.forEach((btn) => {
        btn.addEventListener('click', (e) => {
            const parent = e.currentTarget.parentElement
            parent.style.display = 'none'
        })
    })
</script>
